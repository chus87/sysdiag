name: Native ARM64

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 0'

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck sysstat iproute2 lsof jq python3-jsonschema
      - name: Go tests and race detector on native ARM64
        run: |
          make test-go
          make test-race
      - name: Build official targets
        run: make build-linux
      - name: Execute ARM64 binary natively
        run: |
          test "$(uname -m)" = aarch64
          ./bin/sysdiag-linux-arm64 --version
          ./bin/sysdiag-linux-arm64 --section memory --json | jq -e '.engine == "go-core" and .read_only == true'
