name: SYSdiag CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck sysstat iproute2 lsof jq python3-jsonschema
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Validate pinned toolchain
        run: test "$(go env GOVERSION)" = "go$(cat .go-version)"
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: ShellCheck source tree
        run: make lint
      - name: Build, tests, race, schema and supply-chain metadata
        run: make release-check
      - name: Build and revalidate reproducible release packages
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: ./release.sh /tmp/sysdiag-dist
      - name: Validate structured output
        run: |
          ./sysdiag.sh --all --json > /tmp/sysdiag.json
          jq -e '.schema_version == "1.1" and .sysdiag_version == "0.14.1" and .engine == "go-core" and .read_only == true' /tmp/sysdiag.json
      - uses: actions/upload-artifact@v7
        with:
          name: sysdiag-ci-linux
          path: /tmp/sysdiag-dist/*
          if-no-files-found: error
